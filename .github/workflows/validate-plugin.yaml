name: "Validate Plugin Structure"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  # Fan-in gate for the org "Tested & Coverage" ruleset: the required check is
  # matched by this job's rendered name, and it inherits `needs` semantics, so it
  # is skipped (never green) when validation fails.
  aggregate-tests:
    name: Testing Ready
    runs-on: ${{ fromJson(vars.RUNS_ON) }}
    needs: validate
    steps:
      - run: echo "Testing Ready"

  validate:
    name: Validate plugin structure
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: No symlinks (Codex/Cursor install safety)
        run: sh scripts/check-no-symlinks.sh
      - run: node scripts/validate-structure.mjs
